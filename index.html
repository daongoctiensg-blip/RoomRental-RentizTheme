<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Quản lý phòng trọ / căn hộ</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<script src="js/keygate.js"></script>


<div id="search-view">
<div class="app-header">
  <div>
    <h1>Quản lý phòng trọ / căn hộ</h1>
    <div class="sub">Công cụ nội bộ — không dùng để khách xem trực tiếp</div>
  </div>
  <div style="display:flex;gap:8px;">
    <button class="btn btn-primary" onclick="openAdmin()">🔧 Quản lý</button>
  </div>
</div>

<div class="search-bar-wrap">
  <div class="search-bar">
    <label class="search-bar-field">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"></circle><line x1="16" y1="16" x2="21" y2="21"></line></svg>
      <input type="text" placeholder="Tìm mã phòng / địa chỉ..." oninput="setSearch(this.value)">
    </label>
    <label class="search-bar-field">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 1 1 16 0Z"></path><circle cx="12" cy="10" r="3"></circle></svg>
      <select id="filterDistrict" onchange="onDistrictChange(this.value)"></select>
    </label>
    <label class="search-bar-field">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 1 1 16 0Z"></path><circle cx="12" cy="10" r="3"></circle></svg>
      <input type="text" id="filterWardInput" list="wardList" placeholder="Phường/Xã..." oninput="setFilterWard(this.value)">
      <datalist id="wardList"></datalist>
    </label>
  </div>
</div>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-mobile-header">
      <h3 style="margin:0;">Lọc theo</h3>
      <button class="btn btn-sm" onclick="closeMobileFilters()">✕ Đóng</button>
    </div>
    <div class="filter-block">
      <div class="filter-title">Loại hình</div>
      <label class="checkbox-row"><input type="checkbox" id="ftypePhongTro" onchange="onTypeCheckboxChange()"> Phòng trọ</label>
      <label class="checkbox-row"><input type="checkbox" id="ftypeCanHo" onchange="onTypeCheckboxChange()"> Căn hộ</label>
    </div>
    <div class="filter-block">
      <div class="filter-title">Ngân sách</div>
      <div class="price-range-label"><span id="priceFromLabel"></span> — <span id="priceToLabel"></span></div>
      <div class="dual-range">
        <div class="dual-range-track"></div>
        <div class="dual-range-fill" id="priceFill"></div>
        <input type="range" id="priceRangeMin" min="0" max="15000000" step="100000" oninput="onPriceRangeInput('priceRangeMin')">
        <input type="range" id="priceRangeMax" min="0" max="15000000" step="100000" oninput="onPriceRangeInput('priceRangeMax')">
      </div>
    </div>
    <button class="btn btn-primary sidebar-mobile-apply" onclick="closeMobileFilters()">Xem kết quả (<span id="mobileResultCount">0</span>)</button>
  </aside>

  <div class="content-col">
    <div class="results-header">
      <h2>Tìm thấy <strong id="roomCount">0</strong> phòng phù hợp</h2>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        <div class="seg" id="sortSeg">
          <button class="seg-opt" data-val="default" onclick="setSortBy('default')">Mặc định</button>
          <button class="seg-opt" data-val="price_asc" onclick="setSortBy('price_asc')">Giá thấp nhất</button>
          <button class="seg-opt" data-val="price_desc" onclick="setSortBy('price_desc')">Giá cao nhất</button>
          <button class="seg-opt" data-val="newest" onclick="setSortBy('newest')">Mới nhất</button>
        </div>
        <button class="btn mobile-filter-btn" onclick="openMobileFilters()">⚙ Bộ lọc</button>
      </div>
    </div>
    <div id="miniDashboard"></div>
    <main id="main-content"></main>
  </div>
</div>
</div>

<div id="admin-view" style="display:none;">
  <div class="app-header">
    <div>
      <h1 id="adminTitle">Quản lý</h1>
      <div class="sub">Khu vực quản trị — thêm/sửa/xoá nhà và phòng</div>
    </div>
    <div style="display:flex;gap:8px;">
      <button class="btn" onclick="resetSampleData()">Nạp lại data mẫu</button>
      <button class="btn" onclick="closeAdmin()">← Về trang tìm phòng</button>
    </div>
  </div>
  <main id="admin-content" style="padding:0 28px 40px;max-width:1100px;margin:0 auto;"></main>
</div>

<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>

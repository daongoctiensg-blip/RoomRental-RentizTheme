<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Quản lý phòng trọ / căn hộ</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<script src="js/keygate.js"></script>


<div class="app-header">
  <div>
    <h1>Quản lý phòng trọ / căn hộ</h1>
    <div class="sub">Công cụ nội bộ — không dùng để khách xem trực tiếp</div>
  </div>
  <div style="display:flex;gap:8px;">
    <button class="btn" onclick="resetSampleData()">Nạp lại data mẫu</button>
    <button class="btn" onclick="openPropertyModal(null)">+ Thêm khu</button>
  </div>
</div>

<div class="toolbar">
  <select id="filterProperty" onchange="setFilterProperty(this.value)"></select>
  <select id="filterStatus" onchange="setFilterStatus(this.value)">
    <option value="trong">Còn trống</option>
    <option value="">Tất cả trạng thái</option>
    <option value="da_thue">Đã thuê</option>
    <option value="dang_giu_cho">Đang giữ chỗ</option>
  </select>
  <select id="filterType" onchange="setFilterType(this.value)">
    <option value="phong_tro">Phòng trọ</option>
    <option value="">Tất cả loại</option>
    <option value="can_ho">Căn hộ</option>
  </select>
  <span>Giá</span>
  <input type="number" id="filterPriceFrom" value="0" step="100000" style="width:110px;" onchange="setFilterPrice()" placeholder="Từ">
  <span>—</span>
  <input type="number" id="filterPriceTo" value="1000000000" step="100000" style="width:130px;" onchange="setFilterPrice()" placeholder="Đến">
  <input type="text" list="wardList" placeholder="Phường/Xã..." style="width:160px;" oninput="setFilterWard(this.value)">
  <datalist id="wardList"></datalist>
  <input type="text" placeholder="Tìm mã phòng / tên khu / địa chỉ..." oninput="setSearch(this.value)" style="width:200px;">
  <div class="spacer"></div>
  <div>Đang hiện <strong id="roomCount">0</strong> phòng</div>
</div>

<main id="main-content"></main>

<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>

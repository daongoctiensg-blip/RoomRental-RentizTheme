<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Xuất tin đăng</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600&family=Inter:wght@400;500;600&display=swap');
  * { box-sizing: border-box; }
  body { font-family: 'Inter', system-ui, sans-serif; color: #23281f; max-width: 680px; margin: 0 auto; padding: 32px 24px; line-height: 1.6; }
  h1 { font-family: 'Source Serif 4', serif; font-size: 22px; margin: 0 0 4px; }
  .addr { color: #5b6152; margin-bottom: 16px; }
  .promo { background: #f4ecd7; border: 1px solid #8a6a1f; color: #6b5216; padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; font-size: 14px; }
  h2 { font-size: 15px; margin: 20px 0 8px; border-bottom: 1px solid #ddd8c8; padding-bottom: 4px; }
  ul { margin: 0; padding-left: 20px; }
  li { margin-bottom: 4px; }
  .room-line { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px dashed #ddd8c8; font-size: 14px; }
  .room-line .thumb { width: 52px; height: 52px; object-fit: cover; border-radius: 6px; flex-shrink: 0; }
  .room-line-info { flex: 1; }
  .room-line .code { font-weight: 600; }
  .price { color: #8a6a35; font-weight: 600; white-space: nowrap; }
  .hero-img { width: 100%; max-height: 260px; object-fit: cover; border-radius: 8px; margin-bottom: 16px; display: block; }
  .room-gallery { display: flex; gap: 8px; overflow-x: auto; margin: 12px 0 18px; }
  .room-gallery img { width: 220px; height: 150px; object-fit: cover; border-radius: 8px; flex-shrink: 0; }
  @media print {
    .room-gallery { flex-wrap: wrap; overflow: visible; }
    .room-gallery img { width: 150px; height: 105px; }
  }
  .contact { margin-top: 20px; font-size: 15px; font-weight: 600; }
  .toolbar-print { text-align: center; margin-bottom: 20px; }
  .toolbar-print button { padding: 8px 16px; border-radius: 6px; border: 1px solid #3c5b42; background: #3c5b42; color: #fff; cursor: pointer; font-size: 14px; }
  @media print { .toolbar-print { display: none; } body { padding: 0; } }
</style>
</head>
<body>
<script src="js/keygate.js"></script>


<div class="toolbar-print"><button onclick="window.print()">In / Xuất PDF</button></div>
<div id="content">Đang tải...</div>

<script src="js/store.js"></script>
<script>
const params = new URLSearchParams(location.search);
const type = params.get('type');
const id = params.get('id');

function fmtPrice(n) { return Number(n).toLocaleString('vi-VN') + 'đ'; }
const ROOM_TYPE_LABEL = { ban_cong: 'Ban công', ben_trong: 'Bên trong' };

function fullAddress(prop) {
  const parts = [prop.soNha, prop.ward];
  if (prop.quan) parts.push(prop.quan);
  parts.push(prop.city);
  return parts.filter(Boolean).join(', ');
}

function isPromoActive(promo) {
  if (!promo || !promo.text) return false;
  const today = new Date().toISOString().slice(0, 10);
  if (promo.validFrom && today < promo.validFrom) return false;
  if (promo.validTo && today > promo.validTo) return false;
  return true;
}

function renderPolicyBlocks(prop) {
  let html = '';
  if (prop.amenities && prop.amenities.length) {
    html += `<h2>Tiện ích</h2><ul>${prop.amenities.map(a => `<li>${a}</li>`).join('')}</ul>`;
  }
  if (prop.utilityFees && Object.keys(prop.utilityFees).length) {
    const f = prop.utilityFees;
    html += `<h2>Phí dịch vụ</h2><ul>
      ${f.electricity ? `<li>Điện: ${f.electricity}</li>` : ''}
      ${f.water ? `<li>Nước: ${f.water}</li>` : ''}
      ${f.service ? `<li>Phí dịch vụ: ${f.service}</li>` : ''}
    </ul>`;
  }
  if (prop.nearby && prop.nearby.length) {
    html += `<h2>Di chuyển</h2><ul>${prop.nearby.map(a => `<li>${a}</li>`).join('')}</ul>`;
  }
  return html;
}

// Cọc/hoa hồng giờ thuộc về từng phòng (mỗi phòng có thể khác nhau), không còn ở nhà
function renderRoomPolicyBlocks(room) {
  let html = '';
  if (room.depositPolicy && (room.depositPolicy.months || room.depositPolicy.note)) {
    html += `<h2>Chính sách cọc</h2><ul>`;
    if (room.depositPolicy.months) html += `<li>Cọc: ${room.depositPolicy.months} tháng</li>`;
    if (room.depositPolicy.note) html += `<li>${room.depositPolicy.note}</li>`;
    html += `</ul>`;
  }
  if (room.commissionPolicy && room.commissionPolicy.length) {
    html += `<h2>Hoa hồng</h2><ul>${room.commissionPolicy.map(c => `<li>Hợp đồng ${c.termMonths} tháng: hoa hồng ${c.percent}%</li>`).join('')}</ul>`;
  }
  return html;
}

async function render() {
  const { properties, rooms } = await storeLoad();

  if (type === 'property') {
    const prop = properties.find(p => p.id === id);
    if (!prop) { document.getElementById('content').innerHTML = 'Không tìm thấy nhà này.'; return; }
    const propRooms = rooms.filter(r => r.propertyId === prop.id);
    const visibleRooms = propRooms.filter(r => r.status !== 'da_thue');
    const heroImg = visibleRooms.map(r => r.images && r.images[0]).find(Boolean);
    document.getElementById('content').innerHTML = `
      <h1>${prop.soNha}</h1>
      <div class="addr">${fullAddress(prop)}</div>
      ${heroImg ? `<img class="hero-img" src="${heroImg}" alt="">` : ''}
      <h2>Thông tin chung</h2>
      ${visibleRooms.map(r => {
        const thumb = r.images && r.images[0];
        const promoActive = isPromoActive(r.promotion);
        return `
        <div class="room-line">
          ${thumb ? `<img class="thumb" src="${thumb}" alt="">` : ''}
          <div class="room-line-info">
            <span class="code">${r.floor} – ${r.code}</span> · ${ROOM_TYPE_LABEL[r.roomType] || r.roomType}: ${r.areaM2}m²
            ${promoActive ? `<div style="color:#8a6a1f;font-size:12px;margin-top:2px;">🎉 ${r.promotion.text}</div>` : ''}
          </div>
          <span class="price">${fmtPrice(r.priceMonthly)}/tháng</span>
        </div>
      `;
      }).join('')}
      ${renderPolicyBlocks(prop)}
      <div class="contact">
        <a href="tel:${prop.phone}" style="margin-right:12px;">📞 Gọi ${prop.phone}</a>
        <a href="https://zalo.me/${prop.phone.replace(/\\D/g,'')}" target="_blank">💬 Chat Zalo</a>
      </div>
    `;
  } else if (type === 'room') {
    const room = rooms.find(r => r.id === id);
    if (!room) { document.getElementById('content').innerHTML = 'Không tìm thấy phòng này.'; return; }
    const prop = properties.find(p => p.id === room.propertyId);
    document.getElementById('content').innerHTML = `
      <h1>${prop.soNha} — ${room.floor} ${room.code}</h1>
      <div class="addr">${fullAddress(prop)}</div>
      ${room.images && room.images.length ? `<div class="room-gallery">${room.images.map(u => `<img src="${u}" alt="">`).join('')}</div>` : ''}
      ${isPromoActive(room.promotion) ? `<div class="promo">${room.promotion.text} — áp dụng đến ${room.promotion.validTo}</div>` : ''}
      <div class="room-line">
        <div class="room-line-info">${ROOM_TYPE_LABEL[room.roomType] || room.roomType} · ${room.areaM2}m²</div>
        <span class="price">${fmtPrice(room.priceMonthly)}/tháng</span>
      </div>
      ${room.notes ? `<p>${room.notes}</p>` : ''}
      ${renderPolicyBlocks(prop)}
      ${renderRoomPolicyBlocks(room)}
      <div class="contact">
        <a href="tel:${prop.phone}" style="margin-right:12px;">📞 Gọi ${prop.phone}</a>
        <a href="https://zalo.me/${prop.phone.replace(/\\D/g,'')}" target="_blank">💬 Chat Zalo</a>
      </div>
    `;
  } else {
    document.getElementById('content').innerHTML = 'Thiếu tham số type/id.';
  }
}
render();
</script>
</body>
</html>
